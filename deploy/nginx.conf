server {
    listen 8080;
    server_name _;
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Cloud Run / the LB: never emit absolute redirects with
    # http://host:8080 (container listen port). Relative redirects keep
    # the browser on https://plugai.ripplica.com.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Hashed bundles never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Shell, service worker and manifest must always revalidate, or a phone
    # could keep an index.html that points at bundles no longer on disk.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # SPA routes under /bot must not collide with a static directory.
    # Always hand /bot and /bot/* to the React app.
    location = /bot {
        return 302 /bot/;
    }
    location /bot/ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
