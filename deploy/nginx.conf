server {
    listen 8080;
    server_name _;
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Cloud Run / the LB: never emit absolute redirects with
    # http://host:8080 (container listen port). Relative redirects keep
    # the browser on https://plugai.ripplica.com.
    absolute_redirect off;
    port_in_redirect off;

    # SPA routes under /bot must not collide with a static directory.
    # Always hand /bot and /bot/* to the React app.
    location = /bot {
        return 302 /bot/;
    }
    location /bot/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
